<div class="dark-container mt-5">
  <h1 class="text-center">Welcome to Blackbaud - GrantMatching</h1>
  <h2 class="mt-3">Enter Details</h2>
  <form [formGroup]="grantForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="category">Select Categories</label>
      <select
        id="category"
        multiple
        class="form-control"
        formControlName="category"
      >
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="eligibility">Organization Type</label>
      <select
        id="eligibility"
        multiple
        class="form-control"
        formControlName="eligibility"
      >
        <option *ngFor="let type of eligibilityTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary mt-3">Submit</button>
    </div>
  </form>
</div>

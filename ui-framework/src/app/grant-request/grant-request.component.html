<!-- grant-match.component.html -->
<div class="dark-container mt-5">
  <h1 class="text-center">Welcome to Blackbaud - GrantMatching</h1>
  <h2 class="mt-3">Enter Details</h2>
  <form [formGroup]="grantForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="organizationName">Organization Name</label>
      <input
        type="text"
        id="organizationName"
        class="form-control"
        formControlName="organizationName"
        placeholder="Enter Organization Name"
      />
    </div>

    <div class="form-group">
      <label for="category">Select Categories</label>
      <select
        id="category"
        multiple
        class="form-control"
        formControlName="category"
      >
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="eligibility">Organization Type</label>
      <select
        id="eligibility"
        multiple
        class="form-control"
        formControlName="eligibility"
      >
        <option *ngFor="let type of eligibilityTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="location">Location</label>
      <select id="location" class="form-control" formControlName="location">
        <option *ngFor="let state of states" [value]="state">
          {{ state }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="fundingAmount">Requested Funding Amount ($)</label>
      <input
        type="number"
        id="fundingAmount"
        class="form-control"
        formControlName="fundingAmount"
        placeholder="Enter amount"
      />
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary mt-3">Submit</button>
    </div>
  </form>

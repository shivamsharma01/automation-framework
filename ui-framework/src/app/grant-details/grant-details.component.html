<h1>Grant Details</h1>
<div class="container">
  <h2>{{ grant.title }}</h2>
  <h3>Offered by: {{ grant.org }}</h3>
  <p class="formatted-text">{{ grant.description }}</p>

  <h4>Funds Available: ${{ grant.funds }}</h4>
  <h4>Category: {{ grant.category }}</h4>

  <h5>Eligibility Criteria:</h5>
  <ul>
    <li *ngFor="let criteria of grant.eligibility">{{ criteria }}</li>
  </ul>

  <hr />

  <form [formGroup]="grantForm" (ngSubmit)="onSubmit()">
    <h2>Apply for this Grant</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" formControlName="fullName" class="form-control" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        formControlName="email"
        class="form-control"
        required
      />
      <div
        *ngIf="
          grantForm.controls.email.invalid && grantForm.controls.email.touched
        "
        class="error"
      >
        Email is required.
      </div>
    </div>

    <div class="form-group">
      <label>Organization Name</label>
      <input
        type="text"
        formControlName="organizationName"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>Project Name</label>
      <input type="text" formControlName="projectName" class="form-control" />
    </div>

    <div class="form-group">
      <label>Purpose</label>
      <textarea formControlName="purpose" class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label>Funding Amount ($)</label>
      <input
        type="number"
        formControlName="fundingAmount"
        class="form-control"
        required
      />
      <div
        *ngIf="
          grantForm.controls.fundingAmount.invalid &&
          grantForm.controls.fundingAmount.touched
        "
        class="error"
      >
        Funding amount is required.
      </div>
    </div>

    <h3>Additional Details (Optional)</h3>

    <div class="form-group">
      <label>Expected Outcomes</label>
      <textarea
        formControlName="expectedOutcomes"
        class="form-control"
      ></textarea>
    </div>

    <div class="form-group">
      <label>Target Audience</label>
      <textarea
        formControlName="targetAudience"
        class="form-control"
      ></textarea>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="grantForm.invalid"
    >
      Generate AI-Powered Report
    </button>
  </form>
</div>
